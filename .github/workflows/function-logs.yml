name: Ler logs das funções

# Lê os logs das edge functions do Supabase (Management API) num intervalo,
# filtrando por um texto — para investigar o que aconteceu com uma mensagem.
# Usa o mesmo segredo SUPABASE_ACCESS_TOKEN do deploy. Os logs ficam só no
# resultado desta execução (visível para quem tem acesso ao repositório).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Início (UTC, ex.: 2026-10-05T21:45:00Z)"
        required: true
      end:
        description: "Fim (UTC, ex.: 2026-10-05T21:55:00Z)"
        required: true
      filter:
        description: "Texto que a linha precisa conter (vazio = tudo)"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths: [".github/function-logs-request.json"]

jobs:
  logs:
    name: Ler logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_FILTER: ${{ github.event.inputs.filter }}
        run: |
          if [ -z "$IN_START" ] && [ -f .github/function-logs-request.json ]; then
            IN_START=$(jq -r .start .github/function-logs-request.json)
            IN_END=$(jq -r .end .github/function-logs-request.json)
            IN_FILTER=$(jq -r '.filter // ""' .github/function-logs-request.json)
          fi
          FILTER_SQL=""
          if [ -n "$IN_FILTER" ]; then
            SAFE=$(printf '%s' "$IN_FILTER" | sed "s/'/''/g")
            FILTER_SQL="where event_message like '%${SAFE}%'"
          fi
          SQL="select timestamp, event_message from function_logs ${FILTER_SQL} order by timestamp asc limit 1000"
          curl -sS -G "https://api.supabase.com/v1/projects/rsezgnkfhodltrsewlhz/analytics/endpoints/logs.all" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${SQL}" \
            --data-urlencode "iso_timestamp_start=${IN_START}" \
            --data-urlencode "iso_timestamp_end=${IN_END}" \
            -o logs.json
          jq -r 'if .error then "ERRO: \(.error|tostring)" else (.result // [])[] | "\((.timestamp/1000000)|floor|todate) \(.event_message)" end' logs.json | head -n 1000
