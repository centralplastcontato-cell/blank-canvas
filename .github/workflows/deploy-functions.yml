name: Deploy Edge Functions

# Publica edge functions do Supabase direto pelo GitHub (Actions > Run workflow).
# Requisito unico (uma vez): criar o segredo SUPABASE_ACCESS_TOKEN em
# Settings > Secrets and variables > Actions, com um token gerado em
# https://supabase.com/dashboard/account/tokens

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Funções a publicar (separadas por espaço)"
        required: true
        default: "wapi-send"

jobs:
  deploy:
    name: Publicar no Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy das funções
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FNS: ${{ github.event.inputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Segredo SUPABASE_ACCESS_TOKEN não configurado. Vá em Settings > Secrets and variables > Actions e crie-o com um token de https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          for fn in $FNS; do
            echo "===== Publicando: $fn ====="
            npx supabase@latest functions deploy "$fn" --project-ref rsezgnkfhodltrsewlhz --use-api
          done
          echo "✅ Concluído."
