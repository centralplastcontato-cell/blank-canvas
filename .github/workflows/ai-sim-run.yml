name: Rodar testes da IA (simulador)

# Dispara uma bateria do simulador de testes da IA para uma empresa, como se
# alguém tivesse tocado em "Rodar testes". Só funciona com o módulo IA
# Conversacional ligado para a empresa. O resultado aparece em Configurar IA →
# Testes da IA.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/ai-sim-request.json"]

jobs:
  run:
    name: Rodar testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disparar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          COMPANY=$(jq -r .company_id .github/ai-sim-request.json)
          KEYS=$(curl -sS "https://api.supabase.com/v1/projects/rsezgnkfhodltrsewlhz/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.[] | select(.name=="service_role" or .type=="secret") | .api_key')
          BODY=$(jq -c '{action:"start"} + .' .github/ai-sim-request.json)
          # O projeto pode ter a chave antiga (service_role) e a nova (secret): vale a que a função usa
          for KEY in $KEYS; do
            echo "::add-mask::$KEY"
            OUT=$(curl -sS -X POST "https://rsezgnkfhodltrsewlhz.supabase.co/functions/v1/ai-simulator" \
              -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" -H "Content-Type: application/json" -d "$BODY")
            echo "$OUT"
            echo "$OUT" | grep -q "Sessão inválida" || break
          done
