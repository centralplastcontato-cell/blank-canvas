name: Conferir prévia de link (WhatsApp)

# Busca as URLs de .github/link-preview-request.json como o robô do WhatsApp
# e mostra o que ele recebe: redirecionamentos, tipo, tags og:* e a imagem.
# Só leitura: não usa segredos.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/link-preview-request.json"]

jobs:
  check:
    name: Conferir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir
        run: |
          UA='WhatsApp/2.23.20.0 A'
          for URL in $(jq -r '.urls[]' .github/link-preview-request.json); do
            echo "=================== $URL"
            curl -sS -A "$UA" -L -D - -o page.html -m 20 "$URL" | grep -iE '^(HTTP|location|content-type|content-length)' || true
            echo "--- tags"
            grep -oiE '<meta (property|name)="(og|twitter):[a-z:_]+" content="[^"]*"' page.html | head -20 || true
            IMG=$(grep -oiE 'property="og:image" content="[^"]*"' page.html | head -1 | sed -E 's/.*content="([^"]*)"/\1/')
            if [ -n "$IMG" ]; then
              echo "--- imagem $IMG"
              curl -sS -A "$UA" -L -D - -o img.bin -m 20 "$IMG" | grep -iE '^(HTTP|location|content-type|content-length)' || true
              echo "bytes: $(wc -c < img.bin)"; file img.bin || true
            else
              echo "--- sem og:image"; head -c 600 page.html; echo
            fi
          done
